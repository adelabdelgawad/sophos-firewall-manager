[package]
name = "sophos-firewall-ui"
version = "2.0.0"
edition = "2021"
description = "Desktop UI for the Sophos Firewall Manager"

[lib]
name = "sophos_firewall_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Rust core, reused unchanged.
sfm = { path = "../../rust-app", package = "sophos-firewall-manager" }
